<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#F57C00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000035"/>
    </filter>
  </defs>

  <!-- Background (rounded square) -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGradient)"/>

  <!-- Decorative dots -->
  <circle cx="95" cy="100" r="4" fill="white" opacity="0.25"/>
  <circle cx="425" cy="95" r="5" fill="white" opacity="0.2"/>
  <circle cx="80" cy="400" r="3" fill="white" opacity="0.3"/>
  <circle cx="440" cy="230" r="2" fill="white" opacity="0.25"/>

  <!-- Chat bubble -->
  <g filter="url(#shadow)">
    <rect x="105" y="125" width="300" height="235" rx="30" fill="white"/>
    <path d="M175 345 L155 400 L215 355" fill="white"/>
  </g>

  <!-- Message dots -->
  <circle cx="215" cy="275" r="14" fill="#1E88E5"/>
  <circle cx="256" cy="275" r="14" fill="#1E88E5"/>
  <circle cx="297" cy="275" r="14" fill="#1E88E5"/>

  <!-- Forward badge -->
  <g filter="url(#shadow)">
    <circle cx="372" cy="342" r="52" fill="url(#badgeGradient)"/>
    <circle cx="372" cy="342" r="52" fill="none" stroke="white" stroke-width="4"/>
  </g>

  <!-- Forward arrow -->
  <rect x="342" y="334" width="22" height="16" rx="3" fill="white"/>
  <path d="M364 328 L388 342 L364 356 Z" fill="white"/>
</svg>